services:
  # ============================================
  # Frigate NVR - AI-powered camera monitoring
  # ============================================
  frigate:
    container_name: frigate
    image: ghcr.io/blakeblackshear/frigate:stable
    restart: unless-stopped
    privileged: true
    shm_size: "256mb"
    ports:
      - "5000:5000"   # Frigate Web UI
      - "8554:8554"   # RTSP feeds (re-stream)
      - "8555:8555/tcp" # WebRTC over TCP
      - "8555:8555/udp" # WebRTC over UDP
    volumes:
      - ./frigate/config:/config
      - ./frigate/storage:/media/frigate
      - type: tmpfs
        target: /tmp/cache
        tmpfs:
          size: 1000000000  # 1GB tmpfs for cache
    devices:
      - /dev/dri/renderD128:/dev/dri/renderD128  # Intel VAAPI HW acceleration
    environment:
      - FRIGATE_RTSP_PASSWORD=changeme123
      - TZ=Asia/Karachi
    networks:
      - home-server
    depends_on:
      - mqtt

  # ============================================
  # Home Assistant - Smart home hub
  # ============================================
  homeassistant:
    container_name: homeassistant
    image: ghcr.io/home-assistant/home-assistant:stable
    restart: unless-stopped
    privileged: true
    ports:
      - "8123:8123"   # Home Assistant Web UI
    volumes:
      - ./homeassistant/config:/config
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=Asia/Karachi
    networks:
      - home-server
    depends_on:
      - mqtt
      - frigate

  # ============================================
  # Mosquitto MQTT Broker - Message bus between
  # Frigate and Home Assistant
  # ============================================
  mqtt:
    container_name: mqtt
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"   # MQTT
    volumes:
      - ./mqtt/config:/mosquitto/config
      - ./mqtt/data:/mosquitto/data
      - ./mqtt/log:/mosquitto/log
    networks:
      - home-server

  # ============================================
  # Centralized Ingestion PostgreSQL - phase one
  # Internal network only; no host port is exposed
  # ============================================
  postgres:
    container_name: home-server-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_server}
      POSTGRES_USER: ${POSTGRES_USER:-home_server}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres/data}:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - home-server

  # ============================================
  # Centralized ingestion API and connectors - phase one
  # Host exposure is loopback-only; no media volume is mounted
  # ============================================
  ingestor:
    container_name: home-server-ingestor
    build:
      context: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set in .env}
      POSTGRES_DATA_PATH: /var/lib/postgresql/data
      DATABASE_MAX_BYTES: ${DATABASE_MAX_BYTES:-2147483648}
      MQTT_HOST: ${MQTT_HOST:-mqtt}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_CLIENT_ID: ${MQTT_CLIENT_ID:-home-server-ingestor}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPICS: ${MQTT_TOPICS:-["frigate/events","frigate/reviews","frigate/tracked_object_update","frigate/notifications","frigate/available","frigate/+/status/#"]}
      MQTT_MAX_INFLIGHT: ${MQTT_MAX_INFLIGHT:-100}
      HA_URL: ${HA_URL:-http://homeassistant:8123}
      HA_TOKEN: ${HA_TOKEN:?HA_TOKEN must be set in .env}
      HA_EVENT_TYPES: ${HA_EVENT_TYPES:-["state_changed","automation_triggered","call_service"]}
      HA_HISTORY_MAX_LOOKBACK_SECONDS: ${HA_HISTORY_MAX_LOOKBACK_SECONDS:-900}
      HA_HISTORY_OVERLAP_SECONDS: ${HA_HISTORY_OVERLAP_SECONDS:-5}
      FRIGATE_URL: ${FRIGATE_URL:-http://frigate:5000}
      MEDIA_ARCHIVE_ROOT: ${MEDIA_ARCHIVE_ROOT:-/media_archive}
      MEDIA_ARCHIVE_MAX_BYTES: ${MEDIA_ARCHIVE_MAX_BYTES:-536870912}
      MEDIA_ARCHIVE_RESERVE_FREE_BYTES: ${MEDIA_ARCHIVE_RESERVE_FREE_BYTES:-8589934592}
      MEDIA_ARCHIVE_RETENTION_DAYS: ${MEDIA_ARCHIVE_RETENTION_DAYS:-7}
      MEDIA_RETRY_MAX_ATTEMPTS: ${MEDIA_RETRY_MAX_ATTEMPTS:-3}
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_TOKEN: ${API_TOKEN:?API_TOKEN must be set in .env}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      RETRY_MAX_ATTEMPTS: ${RETRY_MAX_ATTEMPTS:-8}
      RETRY_BASE_SECONDS: ${RETRY_BASE_SECONDS:-0.5}
      RETRY_MAX_DELAY_SECONDS: ${RETRY_MAX_DELAY_SECONDS:-30}
      DISK_WARNING_FREE_BYTES: ${DISK_WARNING_FREE_BYTES:-4294967296}
      DISK_CRITICAL_FREE_BYTES: ${DISK_CRITICAL_FREE_BYTES:-2147483648}
      DISK_WARNING_FREE_RATIO: ${DISK_WARNING_FREE_RATIO:-0.20}
      DISK_CRITICAL_FREE_RATIO: ${DISK_CRITICAL_FREE_RATIO:-0.10}
    volumes:
      - ${POSTGRES_DATA_PATH:-./postgres/data}:/var/lib/postgresql/data:ro
      - ${MEDIA_ARCHIVE_PATH:-./media_archive}:${MEDIA_ARCHIVE_ROOT:-/media_archive}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      mqtt:
        condition: service_started
      homeassistant:
        condition: service_started
    networks:
      - home-server

networks:
  home-server:
    driver: bridge
